<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
  <title>Frontend Mentor | Space tourism website - Crew</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'space-dark': '#0B0D17',
            'space-blue': '#D0D6F9',
          },
          fontFamily: {
            serif: ['Bellefair', 'serif'],
            sans: ['Barlow Condensed', 'sans-serif'],
            body: ['Barlow', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&family=Barlow:wght@400;700&family=Bellefair&display=swap" rel="stylesheet">
  
  <style>
    body { background-image: url('./assets/crew/background-crew-mobile.jpg'); }
    @media (min-width: 768px) { body { background-image: url('./assets/crew/background-crew-tablet.jpg'); } }
    @media (min-width: 1024px) { body { background-image: url('./assets/crew/background-crew-desktop.jpg'); } }
    .glass-nav { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(40.7px); }
  </style>
</head>
<body class="bg-space-dark text-white font-body min-h-screen bg-cover bg-no-repeat flex flex-col justify-between">

  <header class="flex justify-between items-center p-6 md:p-0 md:pl-10 lg:pt-10 relative z-50">
    <a href="index.html">
      <img src="./assets/shared/logo.svg" alt="Logo" class="w-10 h-10 md:w-12 md:h-12" />
    </a>
    <div class="hidden lg:block h-[1px] bg-white/20 grow translate-x-8 z-20"></div>
    <button id="menu-btn" class="md:hidden z-50 focus:outline-none">
      <img id="menu-icon" src="./assets/shared/icon-hamburger.svg" alt="Menu" />
    </button>
    <nav id="nav-menu" class="fixed inset-y-0 right-0 w-3/4 glass-nav translate-x-full md:translate-x-0 transition-transform duration-300 md:static md:w-auto md:px-12 lg:px-24">
      <ul class="flex flex-col md:flex-row gap-8 pt-32 pl-8 md:p-0 tracking-[2.7px] font-sans text-sm uppercase">
        <li><a href="index.html" class="py-2 flex gap-3 border-r-4 md:border-r-0 md:border-b-4 border-transparent hover:border-white/50"><span class="font-bold">00</span> Home</a></li>
        <li><a href="destination-moon.html" class="py-2 flex gap-3 border-r-4 md:border-r-0 md:border-b-4 border-transparent hover:border-white/50"><span class="font-bold">01</span> Destination</a></li>
        <li><a href="crew-commander.html" class="py-2 flex gap-3 border-r-4 md:border-r-0 md:border-b-4 border-white"><span class="font-bold">02</span> Crew</a></li>
        <li><a href="technology-vehicle.html" class="py-2 flex gap-3 border-r-4 md:border-r-0 md:border-b-4 border-transparent hover:border-white/50"><span class="font-bold">03</span> Technology</a></li>
      </ul>
    </nav>
  </header>

  <main class="grow flex flex-col justify-between px-6 md:px-10 lg:px-24 pt-8 w-full max-w-7xl mx-auto">
    <h1 class="font-sans text-base md:text-xl lg:text-2xl tracking-[4.75px] uppercase text-center md:text-left">
      <span class="opacity-25 font-bold mr-4">02</span> Meet your crew
    </h1>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-end grow">
      
      <div class="flex flex-col items-center lg:items-start text-center lg:text-left justify-center my-auto">
        <h2 class="font-serif text-lg md:text-3xl uppercase opacity-50 mb-2">Commander</h2>
        <h3 class="font-serif text-3xl md:text-5xl uppercase mb-4">Douglas Hurley</h3>
        <p class="text-space-blue text-sm md:text-base leading-relaxed max-w-md mb-8">
          Douglas Gerald Hurley is an American engineer, former Marine Corps pilot and former NASA astronaut. He launched into space for the third time as commander of Crew Dragon Demo-2.
        </p>

        <div class="flex gap-4">
          <a href="crew-commander.html" class="w-3.5 h-3.5 rounded-full bg-white" aria-label="Commander"></a>
          <a href="crew-specialist.html" class="w-3.5 h-3.5 rounded-full bg-white/20 hover:bg-white/50" aria-label="Mission Specialist"></a>
          <a href="crew-pilot.html" class="w-3.5 h-3.5 rounded-full bg-white/20 hover:bg-white/50" aria-label="Pilot"></a>
          <a href="crew-engineer.html" class="w-3.5 h-3.5 rounded-full bg-white/20 hover:bg-white/50" aria-label="Flight Engineer"></a>
        </div>
      </div>

      <div class="flex justify-center border-b border-white/20 lg:border-none">
        <img src="./assets/crew/image-douglas-hurley.png" alt="Douglas Hurley" class="h-[220px] md:h-[450px] lg:h-[560px] object-contain" />
      </div>

    </div>
  </main>

  <script src="./main.js"></script>
</body>
</html>
